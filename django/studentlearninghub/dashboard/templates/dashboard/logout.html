{% extends 'dashboard/base.html' %} {% load crispy_forms_tags%}{% load static %}
{% block content %}
<style>
  .logout-container {
    max-width: 600px;
    margin: 100px auto;
    padding: 0 20px;
  }
  .logout-card {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 32px;
    padding: 80px 48px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
  }
  .logout-icon {
    font-size: 5rem;
    background: linear-gradient(135deg, #2dd4bf 0%, #22d3ee 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 30px;
    display: inline-block;
  }
  .logout-title {
    color: white;
    font-size: 2.8rem;
    font-weight: 800;
    margin-bottom: 20px;
    letter-spacing: -1px;
  }
  .logout-message {
    color: var(--text-secondary);
    font-size: 1.2rem;
    margin-bottom: 45px;
    line-height: 1.7;
  }
  .login-btn {
    background: linear-gradient(135deg, #2dd4bf 0%, #0d9488 100%);
    border: none;
    border-radius: 14px;
    padding: 16px 48px;
    font-size: 1.2rem;
    font-weight: 700;
    color: white;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: 0 10px 25px rgba(45, 212, 191, 0.3);
  }
  .login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(45, 212, 191, 0.4);
    color: white;
    filter: brightness(1.1);
  }
  .home-link {
    margin-top: 30px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #2dd4bf;
    font-size: 1.05rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
  }
  .home-link:hover {
    color: #22d3ee;
    text-decoration: underline;
  }
</style>

<div class="logout-container">
  <div class="logout-card">
    <div class="logout-icon">
      <i class="fas fa-sign-out-alt"></i>
    </div>
    <h2 class="logout-title">You're Logged Out</h2>
    <p class="logout-message">
      Your session has ended successfully. Thank you for using Student Learning Hub!
    </p>
    <a class="login-btn" href="{% url 'login' %}">
      <i class="fas fa-sign-in-alt"></i> Log In Again
    </a>
    <br>
    <a class="home-link" href="{% url 'home' %}">
      <i class="fas fa-home"></i> Return to Home
    </a>
  </div>
</div>
{% endblock content %}
