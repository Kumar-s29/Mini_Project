{% extends 'dashboard/base.html' %} 
{% block content %}
<style>
  .ai-container {
    max-width: 900px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .ai-card {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 32px;
    padding: 50px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
  }
  .ai-input {
    background: rgba(15, 23, 42, 0.4);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 25px;
    color: white;
    width: 100%;
    height: 200px;
    margin-bottom: 25px;
    font-size: 1.1rem;
    resize: none;
    transition: all 0.3s ease;
  }
  .ai-input:focus {
    background: rgba(15, 23, 42, 0.6);
    border-color: #6366f1;
    outline: none;
  }
  .result-box {
    background: rgba(99, 102, 241, 0.05);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 20px;
    padding: 30px;
    margin-top: 40px;
    color: white;
    line-height: 1.8;
  }
  .pulse {
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
  }
</style>

<div class="ai-container">
  <div class="text-center mb-5">
    <h1 class="display-4 fw-bold text-white">🤖 AI Study Assistant</h1>
    <p class="text-secondary">Summarize notes and generate quizzes instantly</p>
  </div>

  <div class="ai-card">
    <form method="POST">
      {% csrf_token %}
      <textarea name="text" class="ai-input" placeholder="Paste your study notes or a long paragraph here..."></textarea>
      
      <div class="row g-3">
        <div class="col-md-6">
            <button type="submit" name="action" value="summarize" class="btn btn-primary w-100 py-3 rounded-4 fw-bold">
                <i class="fas fa-magic me-2"></i> Summarize Text
            </button>
        </div>
        <div class="col-md-6">
            <button type="submit" name="action" value="quiz" class="btn btn-indigo w-100 py-3 rounded-4 fw-bold text-white" style="background: #6366f1;">
                <i class="fas fa-question-circle me-2"></i> Generate Quiz
            </button>
        </div>
      </div>
    </form>

    {% if summary %}
    <div class="result-box">
        <h5 class="text-indigo fw-bold mb-3" style="color: #818cf8;"><i class="fas fa-robot me-2"></i> AI INSIGHTS</h5>
        <div class="ai-content">
            {{ summary|linebreaks }}
        </div>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
