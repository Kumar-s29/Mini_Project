<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ note.title }} - Export</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; padding: 50px; max-width: 800px; margin: 0 auto; }
        .header { border-bottom: 2px solid #6366f1; padding-bottom: 20px; margin-bottom: 40px; }
        .title { font-size: 32px; font-weight: bold; color: #1e293b; margin: 0; }
        .meta { color: #64748b; font-size: 14px; margin-top: 10px; }
        .content { font-size: 18px; white-space: pre-wrap; }
        .footer { margin-top: 100px; font-size: 12px; color: #94a3b8; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="no-print" style="background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center;">
        <span>This is a print-friendly version of your note.</span>
        <button onclick="window.print()" style="background: #6366f1; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">Print / Save as PDF</button>
    </div>

    <div class="header">
        <h1 class="title">{{ note.title }}</h1>
        <div class="meta">Exported from Student Learning Hub on {% now "F d, Y" %}</div>
    </div>

    <div class="content">
        {{ note.description }}
    </div>

    <div class="footer">
        Generated by Student Learning Hub &copy; 2026
    </div>
</body>
</html>
